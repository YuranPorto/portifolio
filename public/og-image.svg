<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Grid lines subtle pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- Badge / Pill -->
  <g transform="translate(120, 110)">
    <rect width="280" height="38" rx="19" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#22c55e"/>
    <text x="35" y="24" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">DISPONÍVEL PARA PROJETOS</text>
  </g>

  <!-- Main Headline -->
  <text x="120" y="225" fill="url(#textGrad)" font-family="Inter, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Yuran Porto
  </text>

  <text x="120" y="295" fill="url(#accentGrad)" font-family="Inter, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
    Desenvolvedor Fullstack &amp; Landing Pages
  </text>

  <!-- Subtitle -->
  <text x="120" y="370" fill="#94a3b8" font-family="Inter, sans-serif" font-size="24" font-weight="400">
    Criação de sites de alta conversão para empresas e negócios.
  </text>
  <text x="120" y="405" fill="#64748b" font-family="Inter, sans-serif" font-size="20" font-weight="400">
    Engenharia de software moderna, React, Node.js e velocidade extrema.
  </text>

  <!-- Bottom Badges / Tech tags -->
  <g transform="translate(120, 480)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="22" y="26" fill="#e4e4e7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">React / Next</text>

    <!-- Tag 2 -->
    <rect x="145" y="0" width="120" height="42" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="172" y="26" fill="#e4e4e7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">Node.js</text>

    <!-- Tag 3 -->
    <rect x="280" y="0" width="160" height="42" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="300" y="26" fill="#e4e4e7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">Landing Pages</text>

    <!-- Tag 4 -->
    <rect x="455" y="0" width="150" height="42" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="475" y="26" fill="#e4e4e7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">SEO &amp; Speed</text>

    <!-- URL on bottom right -->
    <text x="820" y="26" fill="#3b82f6" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">yuranporto.com.br</text>
  </g>
</svg>

